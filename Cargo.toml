[package]
name = "postmesh"
version = "0.1.0"
authors = ["Carlos Couto <ccouto@ua.pt>"]
description = "Postprocessor for finite-element results: deformed shapes with contour plots (GiD and CalculiX files)"
edition = "2024"

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "wayland", "x11", "accesskit"] }
flate2 = "1.1.10"
glam = "0.34.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "tiff", "bmp"] }
imageproc = "0.27.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
